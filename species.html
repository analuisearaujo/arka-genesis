<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Espécie | ARKA Genesis</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
*{margin:0;padding:0;box-sizing:border-box}

body{
background:#06110D;
color:#F5F5F2;
font-family:Arial,sans-serif;
}

.hero{
position:relative;
height:320px;
overflow:hidden;
}

.hero img{
width:100%;
height:100%;
object-fit:cover;
}

.voltar{
position:absolute;
top:20px;
left:20px;

background:rgba(0,0,0,.45);
color:white;

border:none;

width:44px;
height:44px;

border-radius:50%;

font-size:22px;
}

.overlay{

position:absolute;
left:0;
right:0;
bottom:0;

padding:28px;

background:linear-gradient(to top,
rgba(0,0,0,.85),
transparent);

}

.overlay h1{

font-size:42px;
color:#D4AF37;

}

.overlay p{

margin-top:6px;
font-size:18px;

color:#D7DDD7;

}

.container{

padding:28px;

}

.card{

background:#0B1A15;

border:1px solid rgba(212,175,55,.12);

border-radius:24px;

padding:22px;

margin-bottom:20px;

}

.card h2{

color:#D4AF37;
margin-bottom:14px;

}

.grid{

display:grid;
grid-template-columns:repeat(2,1fr);
gap:14px;

}

.item{

background:#10241C;

border-radius:18px;

padding:16px;

}

.label{

font-size:13px;
color:#9EB0A2;

margin-bottom:6px;

}

.valor{

font-size:18px;
font-weight:bold;

}

#mapaDist{

height:220px;

border-radius:18px;

overflow:hidden;

}

button.acao{

width:100%;

padding:18px;

border:none;

border-radius:18px;

background:#D4AF37;

color:#08120F;

font-size:18px;
font-weight:bold;

}
</style>

<link href="https://unpkg.com/maplibre-gl@5/dist/maplibre-gl.css" rel="stylesheet">

</head>

<body>

<div class="hero">

<img id="foto" src="" alt="Espécie">

<button class="voltar" onclick="history.back()">←</button>

<div class="overlay">
<h1 id="nome">Espécie</h1>
<p id="comum">Nome comum</p>
</div>

</div>

<div class="container">

<div class="card">

<h2>Status de Conservação</h2>

<div class="grid">

<div class="item">
<div class="label">IUCN</div>
<div class="valor" id="status">Carregando...</div>
</div>

<div class="item">
<div class="label">Observações ARKA</div>
<div class="valor" id="totalObs">0</div>
</div>

</div>

</div>

<div class="card">

<h2>Informações</h2>

<div class="grid">

<div class="item">
<div class="label">Habitat</div>
<div class="valor" id="habitat">—</div>
</div>

<div class="item">
<div class="label">Alimentação</div>
<div class="valor" id="alimentacao">—</div>
</div>

<div class="item">
<div class="label">Distribuição</div>
<div class="valor" id="distribuicao">—</div>
</div>

<div class="item">
<div class="label">Grupo</div>
<div class="valor" id="grupo">—</div>
</div>

</div>

</div>

<div class="card">

<h2>Onde ela ocorre</h2>

<div id="mapaDist"></div>

</div>

<button class="acao">
Ver todas as observações
</button>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://unpkg.com/maplibre-gl@5/dist/maplibre-gl.js"></script>

<script>

const supabaseARKA = window.supabase.createClient(
"https://haoqywnqxeydylfzxqzz.supabase.co",
"sb_publishable_JFc8Bh6QZyFx5iO-7izQ4g_jx8SjxS7"
);

const especie = new URLSearchParams(location.search)
.get("species");

const mapa = new maplibregl.Map({

container:"mapaDist",
style:"https://tiles.openfreemap.org/styles/fiord",
center:[-51,-15],
zoom:2

});

(async()=>{

const {data}=await supabaseARKA
.from("observations")
.select("*")
.eq("species",especie);

if(!data?.length)return;

const obs=data[0];

foto.src=obs.image_url;
nome.textContent=obs.species;
comum.textContent=obs.common_name||"Sem nome comum";
totalObs.textContent=data.length;

new maplibregl.Marker({color:"#D4AF37"})
.setLngLat([obs.longitude,obs.latitude])
.addTo(mapa);

mapa.setCenter([obs.longitude,obs.latitude]);
mapa.setZoom(5);

/* Dados temporários */

if(obs.species.toLowerCase().includes("cascavel (crotalus-durissus)")){

status.textContent="Pouco Preocupante";
habitat.textContent="Campos e Cerrados";
alimentacao.textContent="Roedores";
distribuicao.textContent="América do Sul";
grupo.textContent="Répteis";

}

})();
</script>

</body>
</html>
