<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ARKA Map</title>

  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

  <style>
    html, body{
      margin:0;
      height:100%;
      background:#050505;
      font-family:Arial,sans-serif;
    }

    #map{
      width:100%;
      height:100vh;
    }
  </style>
</head>
<body>

  <div id="erroDebug"
     style="display:none;
            position:fixed;
            top:10px;
            left:10px;
            right:10px;
            background:#8B0000;
            color:white;
            padding:12px;
            border-radius:8px;
            z-index:9999;
            font-family:monospace;
            white-space:pre-wrap;">
</div>
<div id="map"></div>
  
<script>
window.onerror = function(msg, url, line, col) {
  const erro = document.getElementById("erroDebug");
  erro.style.display = "block";
  erro.textContent = `ERRO: ${msg}\nLinha: ${line}:${col}`;
};
</script>
  
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>
const supabaseARKA = window.supabase.createClient(
  "https://haoqywnqxeydylfzxqzz.supabase.co",
  "sb_publishable_JFc8Bh6QZyFx5iO-7izQ4g_jx8SjxS7"
);

const mapa = L.map("map").setView([-14.235, -51.925], 4);

L.tileLayer(
  "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
  { attribution: "© OpenStreetMap" }
).addTo(mapa);

const iconeARKA = L.divIcon({
  className: "",
  html: `<div style="
    width:20px;
    height:20px;
    background:#D4AF37;
    border:3px solid #050505;
    border-radius:50%;
    box-shadow:0 0 12px rgba(212,175,55,.6);
  "></div>`,
  iconSize:[20,20],
  iconAnchor:[10,10]
});

async function carregarObservacoes(){

  const { data, error } = await supabaseARKA
    .from("observations")
    .select("*")
    .not("latitude","is",null)
    .not("longitude","is",null);

  if(error){
    alert(error.message);
    return;
  }

  const limites=[];

  data.forEach(obs=>{

    L.marker([obs.latitude, obs.longitude], {icon: iconeARKA})
      .addTo(mapa)
      .bindPopup(`
        <div style="width:220px;background:#111;color:white;padding:10px;border-radius:12px;">
          <img src="${obs.image_url}"
               style="width:100%;height:130px;object-fit:cover;border-radius:8px;margin-bottom:8px;">
          <div style="color:#D4AF37;font-weight:bold;">
            ${obs.species}
          </div>
          <div style="color:#999;font-size:13px;margin-bottom:8px;">
            ${obs.common_name || "Sem nome comum"}
          </div>
          <div style="font-size:13px;">
            ${obs.notes || "Sem observações"}
          </div>
        </div>
      `);

    limites.push([obs.latitude, obs.longitude]);

  });

  if(limites.length){
    mapa.fitBounds(limites,{padding:[40,40]});
  }

}

carregarObservacoes();
</script>

</body>
</html>
