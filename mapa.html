<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ARKA Map</title>

<link href="https://unpkg.com/maplibre-gl@5/dist/maplibre-gl.css" rel="stylesheet">

<style>
html,body{
  margin:0;
  width:100%;
  height:100%;
  background:#050505;
  font-family:Arial,sans-serif;
}

#map{
  position:absolute;
  inset:0;
}

.arka-marker{
  width:20px;
  height:20px;
  border-radius:50%;
  background:#D4AF37;
  border:3px solid #050505;
  box-shadow:0 0 12px rgba(212,175,55,.7);
  cursor:pointer;
}
/* ===========================
   PAINEL PREMIUM ARKA
=========================== */

#painelObservacao{
  position:fixed;
  left:0;
  right:0;
  bottom:-100%;
  background:#08120F;
  color:#F5F5F2;
  border-radius:30px 30px 0 0;
  transition:bottom .35s ease;
  z-index:5000;
  overflow:hidden;
  box-shadow:0 -20px 60px rgba(0,0,0,.55);
}

#painelObservacao.aberto{
  bottom:0;
}

#painelBarra{
  width:46px;
  height:5px;
  background:#4A6358;
  border-radius:999px;
  margin:12px auto;
}

#painelFechar{
  position:absolute;
  top:18px;
  right:18px;
  width:36px;
  height:36px;
  border:none;
  border-radius:50%;
  background:rgba(255,255,255,.08);
  color:white;
  font-size:18px;
  cursor:pointer;
}

#painelImagem{
  width:100%;
  height:220px;
  object-fit:cover;
}

.painelConteudo{
  padding:24px;
}

#painelEspecie{
  color:#D4AF37;
  margin:0 0 6px;
  font-size:28px;
}

#painelNomeComum{
  color:#C8D2C8;
  margin-bottom:18px;
}

.infoLinha{
  margin-bottom:10px;
  color:#A7B5AB;
}

#painelNotas{
  margin:22px 0;
  line-height:1.7;
}

#btnVerEspecie{
  width:100%;
  padding:18px;
  border:none;
  border-radius:18px;
  background:#D4AF37;
  color:#08120F;
  font-size:17px;
  font-weight:bold;
  cursor:pointer;
}
</style>
</head>

<body>

<div id="map"></div>

<div id="painelObservacao">

  <div id="painelBarra"></div>

  <button id="painelFechar">✕</button>

  <img id="painelImagem" src="" alt="Observação">

  <div class="painelConteudo">

    <h2 id="painelEspecie">Espécie</h2>

    <p id="painelNomeComum">Nome comum</p>

    <div class="infoLinha">
      📅 <span id="painelData">--</span>
    </div>

    <div class="infoLinha">
      📍 <span id="painelCoordenadas">--</span>
    </div>

    <p id="painelNotas">Sem observações.</p>

    <button id="btnVerEspecie">Ver espécie</button>

  </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://unpkg.com/maplibre-gl@5/dist/maplibre-gl.js"></script>

<script>
const supabaseARKA = window.supabase.createClient(
  "https://haoqywnqxeydylfzxqzz.supabase.co",
  "sb_publishable_JFc8Bh6QZyFx5iO-7izQ4g_jx8SjxS7"
);

const mapa = new maplibregl.Map({
  container: "map",
  style: "https://tiles.openfreemap.org/styles/fiord",
  center: [-51.925,-14.235],
  zoom: 4
});

mapa.addControl(new maplibregl.NavigationControl(),"top-right");

mapa.on("load", async ()=>{

  const {data,error}=await supabaseARKA
    .from("observations")
    .select("*")
    .not("latitude","is",null)
    .not("longitude","is",null);

  if(error){
    console.error(error);
    return;
  }

  const bounds=new maplibregl.LngLatBounds();

  data.forEach(obs=>{

    const el=document.createElement("div");
    el.className="arka-marker";

    const popup=new maplibregl.Popup({offset:20})
      .setHTML(`
        <div style="padding:6px">
          <strong style="color:#D4AF37">${obs.species}</strong><br>
          <small>${obs.common_name||"Sem nome comum"}</small>
        </div>
      `);

    new maplibregl.Marker({element:el})
      .setLngLat([Number(obs.longitude),Number(obs.latitude)])
      .setPopup(popup)
      .addTo(mapa);

    bounds.extend([Number(obs.longitude),Number(obs.latitude)]);
  });

  if(!bounds.isEmpty()){
    mapa.fitBounds(bounds,{padding:60});
  }

});

const painel = document.getElementById("painelObservacao");
const painelImagem = document.getElementById("painelImagem");
const painelEspecie = document.getElementById("painelEspecie");
const painelNomeComum = document.getElementById("painelNomeComum");
const painelData = document.getElementById("painelData");
const painelCoordenadas = document.getElementById("painelCoordenadas");
const painelNotas = document.getElementById("painelNotas");

document.getElementById("painelFechar").onclick = () => {
  painel.classList.remove("aberto");
};

function abrirPainel(obs){

  painelImagem.src = obs.image_url || "";
  painelEspecie.textContent = obs.species || "Espécie desconhecida";
  painelNomeComum.textContent = obs.common_name || "Sem nome comum";
  painelNotas.textContent = obs.notes || "Sem observações";

  painelCoordenadas.textContent =
    `${Number(obs.latitude).toFixed(5)}, ${Number(obs.longitude).toFixed(5)}`;

  painelData.textContent = obs.created_at
    ? new Date(obs.created_at).toLocaleDateString("pt-BR")
    : "Data indisponível";

  painel.classList.add("aberto");
}
</script>

</body>
</html>
