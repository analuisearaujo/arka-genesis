<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ARKA Map</title>

<link rel="stylesheet"
href="https://unpkg.com/maplibre-gl@5/dist/maplibre-gl.css">

<style>
html,
body{
  margin:0;
  padding:0;
  width:100%;
  height:100%;
  background:#050505;
  font-family:Arial,sans-serif;
}

#map{
  position:absolute;
  top:0;
  left:0;
  width:100%;
  height:100%;
}


#painelObservacao{
  position:fixed;
  left:0;
  right:0;
  bottom:-100%;
  background:#111;
  color:white;
  border-radius:28px 28px 0 0;
  padding:22px;
  transition:bottom .35s ease;
  z-index:10;
  box-shadow:0 -15px 40px rgba(0,0,0,.55);
}

#painelObservacao.aberto{
  bottom:0;
}

#painelImagem{
  width:100%;
  height:210px;
  object-fit:cover;
  border-radius:16px;
  margin-bottom:16px;
}

#painelEspecie{
  margin:0;
  color:#D4AF37;
}

#painelNomeComum{
  margin:6px 0 16px;
  color:#9b9b9b;
}

#painelNotas{
  line-height:1.6;
  margin-bottom:18px;
}

#painelCoordenadas{
  color:#777;
  font-size:13px;
}

#painelFechar{
  position:absolute;
  top:18px;
  right:18px;
  cursor:pointer;
  font-size:22px;
  color:#999;
}


.maplibregl-popup-content{
  background:#111;
  color:white;
  border-radius:16px;
  border:1px solid #2b2b2b;
  box-shadow:0 10px 30px rgba(0,0,0,.5);
}

.maplibregl-popup-close-button{
  color:#D4AF37;
}
</style>
</head>

<body>

<div id="erroDebug"></div>

<div id="map"></div>

<div id="painelObservacao">

<div id="painelFechar">✕</div>

<img id="painelImagem" src="" alt="Observação">

<h2 id="painelEspecie">Espécie</h2>

<p id="painelNomeComum">Nome comum</p>

<div id="painelNotas">Observações</div>

<div id="painelCoordenadas">📍 --</div>

</div>

<script>

window.onerror=function(msg,url,line,col){

const erro=document.getElementById("erroDebug");

erro.style.display="block";

erro.textContent=`ERRO: ${msg}
Linha: ${line}:${col}`;

};

</script>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://unpkg.com/maplibre-gl@5/dist/maplibre-gl.js"></script>

<script>
const supabaseARKA = window.supabase.createClient(
  "https://haoqywnqxeydylfzxqzz.supabase.co",
  "sb_publishable_JFc8Bh6QZyFx5iO-7izQ4g_jx8SjxS7"
);

const mapa = new maplibregl.Map({
  container: "map",
  style: "https://tiles.openfreemap.org/styles/dark",
  center: [-51.925, -14.235],
  zoom: 4
});

mapa.on("load", () => {
  carregarObservacoes();
});
  
const iconeARKA = L.divIcon({
  className: "",
  html: `<div style="
    width:20px;
    height:20px;
    background:#D4AF37;
    border:3px solid #050505;
    border-radius:50%;
    box-shadow:0 0 12px rgba(212,175,55,.6);
  "></div>`,
  iconSize:[20,20],
  iconAnchor:[10,10]
});

const painel = document.getElementById("painelObservacao");
const painelImagem = document.getElementById("painelImagem");
const painelEspecie = document.getElementById("painelEspecie");
const painelNomeComum = document.getElementById("painelNomeComum");
const painelNotas = document.getElementById("painelNotas");
const painelCoordenadas = document.getElementById("painelCoordenadas");

document.getElementById("painelFechar").onclick = () => {
  painel.classList.remove("aberto");
};

function abrirPainel(obs){
  painelImagem.src = obs.image_url;
  painelEspecie.textContent = obs.species;
  painelNomeComum.textContent = obs.common_name || "Sem nome comum";
  painelNotas.textContent = obs.notes || "Sem observações";
  painelCoordenadas.textContent =
    `📍 ${obs.latitude.toFixed(5)}, ${obs.longitude.toFixed(5)}`;
  painel.classList.add("aberto");
}


async function carregarObservacoes(){

  const { data, error } = await supabaseARKA
    .from("observations")
    .select("*")
    .not("latitude","is",null)
    .not("longitude","is",null);
  console.log("Observações:", data);

  if(error){
    throw error;
  }

  const bounds = new maplibregl.LngLatBounds();

  data.forEach(obs => {

    const popup = new maplibregl.Popup({
      offset: 25
    }).setHTML(`
      <div style="text-align:center">
        <strong style="color:#D4AF37">${obs.species}</strong><br>
        <small>${obs.common_name || "Sem nome comum"}</small>
      </div>
    `);

    const elemento = document.createElement("div");
elemento.style.width = "20px";
elemento.style.height = "20px";
elemento.style.background = "#D4AF37";
elemento.style.border = "3px solid #050505";
elemento.style.borderRadius = "50%";
elemento.style.boxShadow = "0 0 12px rgba(212,175,55,.7)";
elemento.style.cursor = "pointer";

const popup = new maplibregl.Popup({ offset: 20 }).setHTML(`
  <div style="text-align:center">
    <strong style="color:#D4AF37">${obs.species}</strong><br>
    <small>${obs.common_name || "Sem nome comum"}</small>
  </div>
`);

new maplibregl.Marker({ element: elemento })
  .setLngLat([obs.longitude, obs.latitude])
  .setPopup(popup)
  .addTo(mapa);

elemento.addEventListener("click", () => abrirPainel(obs));

    bounds.extend([obs.longitude, obs.latitude]);

  });

  if(!bounds.isEmpty()){
    mapa.fitBounds(bounds,{
      padding:60
    });
  }

}
if(limites.length){

const bounds=new maplibregl.LngLatBounds();

limites.forEach(p=>{
bounds.extend([p[1],p[0]]);
});

mapa.fitBounds(bounds,{
padding:60
});

}
</script>
